[project]
name = "rosie"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core ML
    "torch>=2.4",
    "transformers>=4.46",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "peft>=0.13",
    "safetensors",
    # WAN / diffusion
    "diffusers>=0.32",
    "ftfy",
    # Data
    "lerobot",
    "pyarrow",
    "imageio>=2.34",
    "imageio-ffmpeg",
    # Utilities
    "torchvision",
    "pillow",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosie"]
